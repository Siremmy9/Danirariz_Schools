<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Danirariz Schools</title>
    <meta
      name="description"
      content="Contact Danirariz Schools, Majek, opposite Fara Park Estate, Epe-Ajah Expressway, Lagos. Call, WhatsApp, send a message or get directions." />
    <meta
      name="keywords"
      content="Danirariz Schools, school in Lagos, Epe-Ajah Expressway school, creche, nursery school, primary school, secondary school, Majek Lagos, admission, private school Lagos" />
    <meta name="theme-color" content="#6D1230" />
    <!-- Replace YOUR-DOMAIN.com with the live address of the website -->
    <link rel="canonical" href="https://YOUR-DOMAIN.com/contact.html" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Danirariz Schools" />
    <meta property="og:title" content="Contact | Danirariz Schools" />
    <meta
      property="og:description"
      content="Contact Danirariz Schools, Majek, opposite Fara Park Estate, Epe-Ajah Expressway, Lagos. Call, WhatsApp, send a message or get directions." />
    <meta property="og:url" content="https://YOUR-DOMAIN.com/contact.html" />
    <!-- Add a 1200x630 image at assets/images/og-cover.jpg for rich link previews -->
    <meta
      property="og:image"
      content="https://YOUR-DOMAIN.com/assets/images/og-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" href="assets/icons/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500&display=swap" />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/responsive.css" />
  </head>
  <body>
    <a class="skip-link" href="#main">Skip to main content</a>
    <header class="site-header" id="site-header"></header>
    <noscript
      ><p style="padding: 6rem 1rem 1rem; text-align: center">
        Please enable JavaScript to view this website.
      </p></noscript
    >
    <main id="main">
      <section class="page-hero">
        <div class="container">
          <h1>Contact us</h1>
          <p>
            We would love to hear from you. Visit, call, message us on WhatsApp
            or send a note.
          </p>
        </div>
      </section>
      <section class="section" aria-labelledby="contact-h">
        <div class="container contact-grid">
          <div class="contact-card reveal">
            <div data-render="contact-details"></div>
            <div class="btn-row" style="margin-top: 1.5rem">
              <a
                class="btn btn-gold"
                data-wa
                target="_blank"
                rel="noopener"
                data-icon="whatsapp"
                >Chat on WhatsApp</a
              >
            </div>
          </div>
          <div class="form-card reveal">
            <h2 id="contact-h">Send us a message</h2>
            <form id="contact-form" novalidate>
              <div class="form-grid">
                <div class="field">
                  <label for="name"
                    >Name <span class="req" aria-hidden="true">*</span></label
                  ><input
                    id="name"
                    name="name"
                    type="text"
                    required
                    autocomplete="name" />
                </div>
                <div class="field">
                  <label for="email"
                    >Email <span class="req" aria-hidden="true">*</span></label
                  ><input
                    id="email"
                    name="email"
                    type="email"
                    required
                    autocomplete="email" />
                </div>
                <div class="field">
                  <label for="phone"
                    >Phone <span class="optional">(optional)</span></label
                  ><input
                    id="phone"
                    name="phone"
                    type="tel"
                    autocomplete="tel" />
                </div>
                <div class="field">
                  <label for="subject"
                    >Subject
                    <span class="req" aria-hidden="true">*</span></label
                  ><input id="subject" name="subject" type="text" required />
                </div>
                <div class="field full">
                  <label for="message"
                    >Message
                    <span class="req" aria-hidden="true">*</span></label
                  ><textarea
                    id="message"
                    name="message"
                    rows="5"
                    required></textarea>
                </div>
              </div>
              <div class="hp" aria-hidden="true">
                <label
                  >Leave this empty<input
                    type="text"
                    name="website"
                    tabindex="-1"
                    autocomplete="off"
                /></label>
              </div>
              <button class="btn btn-wine" type="submit">Send Message</button>
            </form>
          </div>
        </div>
      </section>
      <section
        class="section section--tint"
        id="find-us"
        aria-labelledby="map-h">
        <div class="container">
          <div class="section-head">
            <h2 id="map-h">Find us</h2>
            <p data-cfg="location">
              Majek, opposite Fara Park Estate, Epe-Ajah Expressway, Lagos
            </p>
          </div>
          <div class="map-box" data-render="map"></div>
          <p style="margin-top: 1.5rem">
            <a class="btn btn-wine" data-directions>Get Directions</a>
          </p>
        </div>
      </section>
    </main>
    <footer class="site-footer" id="site-footer"></footer>
    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
    <script src="js/admissions.js"></script>
  </body>
</html>
